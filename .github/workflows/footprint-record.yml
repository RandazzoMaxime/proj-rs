name: Footprint record

# Temporary: runs bench/footprint.sh (size on disk and peak memory, proj-rs against PROJ 9.9.0
# built from source) on the CI x86-64 machine and keeps bench/footprint.json. It runs only when
# this file changes. Removed once the file is in the repository.
on:
  pull_request:
    paths:
      - .github/workflows/footprint-record.yml

jobs:
  footprint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y cmake libsqlite3-dev libtiff-dev libcurl4-openssl-dev valgrind
      - name: Footprint
        env:
          BENCH_MACHINE: gha-ubuntu-24.04-x86_64
          FOOTPRINT_JOBS: 4
        run: sh bench/footprint.sh
      - name: The file
        run: cat bench/footprint.json | head -c 3000
      - uses: actions/upload-artifact@v4
        with:
          name: footprint
          path: bench/footprint.json
