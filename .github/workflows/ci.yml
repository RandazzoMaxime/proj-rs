name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Linux runs the AVX2 batch path (own vector math); Windows checks the scalar build;
        # macOS runs on Apple silicon and Linux ARM on aarch64, both on the NEON batch path (the
        # same vector math, so the same bits as AVX2), with the libm of Apple and of glibc.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # The reference is PROJ 9.9.0 itself, the version every port is checked
      # against. Ubuntu's apt ships 9.4, so the binaries come from conda-forge,
      # on macOS too.
      - if: runner.os != 'Windows'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: proj-ref
          create-args: proj=9.9.0 --channel conda-forge
          init-shell: bash
      - if: runner.os != 'Windows'
        shell: bash -el {0}
        run: |
          echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
          echo "PROJ_RS_LIBPROJ_DIR=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: |
          C:\Miniconda\condabin\conda.bat install -y -c conda-forge proj=9.9.0
          echo "C:\Miniconda\Library\bin" >> $env:GITHUB_PATH
          echo "PROJ_RS_LIBPROJ_DIR=C:\Miniconda\Library\lib" >> $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The default build has no TLS library (feature `network`, as PROJ without libcurl):
      # it must compile warning-free, keep out `native-tls`, and behave as such.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - shell: bash
        run: |
          if cargo tree -e normal --workspace | grep -E 'native-tls|openssl'; then
            echo "a TLS crate is in the default tree" >&2
            exit 1
          fi
      - run: cargo test -p proj-rs --test network_feature_off
        env:
          PROJ_SKIP_READ_USER_WRITABLE_DIRECTORY: YES
      # Offline, as PROJ's ctest runs its suites. The differential check
      # against the reference cs2cs must run here, so a missing binary fails.
      # PROJ_SKIP_READ_USER_WRITABLE_DIRECTORY is what PROJ's test setup sets:
      # no grid left in a user cache can change an offline result.
      - run: cargo test --workspace --all-features
        env:
          PROJ_CS2CS_REQUIRED: "1"
          PROJ_SKIP_READ_USER_WRITABLE_DIRECTORY: YES
      # PROJ runs the gie files that fetch grids only with PROJ_NETWORK=ON
      # (test/CMakeLists.txt). The same files run here. Fetched grids are
      # cached in the user writable directory, which the engine searches first.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/proj
          key: proj-grids-${{ runner.os }}-9.9.0-v1
      - run: cargo test -p proj-rs --all-features --test gie_run
        env:
          PROJ_NETWORK: ON
          PROJ_USER_WRITABLE_DIRECTORY: ${{ runner.temp }}/proj
      # The bench is not timed in CI (shared runners are noisy), only built, and
      # linked against the reference libproj (PROJ_RS_LIBPROJ_DIR) so that code builds.
      - run: cargo build --release --bin proj-rs-bench

  # The C library: the C tests of PROJ 9.9.0, compiled against libproj of proj-rs and run
  # (capi/tests/README.md). The reference tree gives the test sources and the data directory.
  capi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y cmake libsqlite3-dev libgtest-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/proj-reference
          key: proj-reference-9.9.0-${{ hashFiles('tools/build-reference.sh') }}
      - run: tools/build-reference.sh
      - run: capi/tests/run.sh --release
        env:
          PROJ_REFERENCE: ${{ github.workspace }}/target/proj-reference

  # Windows: proj.dll and proj.lib (capi/tests/dist.ps1), then `include_proj_h_from_c.c` of PROJ
  # compiled with MSVC against them and run. test_c_api needs googletest and a PROJ tree built
  # with CMake: it stays on Linux.
  capi-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: capi\tests\dist.ps1 -Release
      - name: include_proj_h_from_c against proj.lib
        run: |
          git clone --depth 1 --branch 9.9.0 https://github.com/OSGeo/PROJ.git $env:RUNNER_TEMP\PROJ
          cl /nologo /W3 /I target\capi-dist\include $env:RUNNER_TEMP\PROJ\test\unit\include_proj_h_from_c.c /Fe:target\capi-dist\bin\include_h.exe /link target\capi-dist\lib\proj.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          target\capi-dist\bin\include_h.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The documentation has no warning, and the root page shows the stable surface only:
  # the internals are #[doc(hidden)] unless the `unstable` feature is on.
  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: |
          if grep -q 'iso19111\|struct.Operation.html\|struct.Tmerc.html' target/doc/proj_rs/index.html; then
            echo "the root page of proj_rs shows an internal item" >&2
            exit 1
          fi
      - run: cargo doc -p proj-rs --no-deps --features unstable
        env:
          RUSTDOCFLAGS: -D warnings

  # `rust-version` is the minimum the crates build with: 1.83, measured, lower than the toolchain
  # of the release (1.100). The job installs the declared version, so changing it moves the
  # check. A newer standard-library method in the code fails it: `src/compat.rs` has the
  # equivalents.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: declared
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          for manifest in georust/Cargo.toml capi/Cargo.toml; do
            other=$(grep -m1 '^rust-version' "$manifest" | cut -d'"' -f2)
            if [ "$other" != "$version" ]; then
              echo "$manifest declares rust-version $other, Cargo.toml declares $version" >&2
              exit 1
            fi
          done
          case "$version" in *.*.*) ;; *) version="$version.0" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      # Every feature but `avx512`: the AVX-512 batch path uses the `std::arch` AVX-512 types,
      # stable since Rust 1.89, so its cargo feature (which enables `pulp/x86-v4`) cannot build on
      # the MSRV toolchain. Keep this list in sync with the `[features]` of the workspace manifests.
      - run: >-
          cargo check --workspace --lib --bins --features
          "proj-rs/geo-types,proj-rs/network,proj-rs/unstable,proj-rs-georust/geo-types,proj-rs-georust/network,proj-rs-georust/tiff,proj-rs-georust/bundled_proj,proj-rs-georust/pkg_config,proj-rs-capi/network"

  # Breaking changes of the stable surface against the last published version.
  # Disabled: 1.0.0 of proj-rs and proj-rs-georust is ready to publish (docs/PUBLISHING.md) but is
  # not on crates.io yet, so there is nothing to compare with. Once it is, delete the `if: false`
  # line: `cargo-semver-checks` then compares each crate with the latest release of the registry.
  semver:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: proj-rs, proj-rs-georust

  # Advisories (RustSec), licenses, registries and bans of the dependency tree: `deny.toml`.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
