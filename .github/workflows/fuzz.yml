name: Fuzz
# Not on pull requests: a short robustness run every night, or on demand (docs/FUZZ.md).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        target: [proj_string, user_input, transform, grid_reader, model_files]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: python3 fuzz/seed.py
      - run: cargo fuzz build ${{ matrix.target }}
        working-directory: fuzz
      - run: ./run.sh "${{ github.event.inputs.seconds || '240' }}" ${{ matrix.target }}
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/logs/${{ matrix.target }}.log
