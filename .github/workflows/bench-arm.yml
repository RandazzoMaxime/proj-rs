name: Bench ARM

# Temporary: times the batch cases of the bench on real aarch64 hardware, on `main` and on this
# branch, run in turn on the same machine, and prints the smallest time of each case. It runs only
# when this file changes. Removed once the numbers are in docs/PORTING-simd.md.
on:
  pull_request:
    paths:
      - .github/workflows/bench-arm.yml

jobs:
  bench:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline tree
        run: git worktree add ../base origin/main
      - name: Build both
        run: |
          cargo build --release --bin proj-rs-bench
          (cd ../base && cargo build --release --bin proj-rs-bench)
      - name: Run in turn
        env:
          PROJ_SKIP_READ_USER_WRITABLE_DIRECTORY: YES
        run: |
          uname -m; (sysctl -n machdep.cpu.brand_string 2>/dev/null || grep -m1 -i "model name\|cpu part" /proc/cpuinfo || true)
          for round in 1 2 3 4 5 6 7; do
            (cd ../base && PROJ_DATA="$PWD/data" target/release/proj-rs-bench >> "$GITHUB_WORKSPACE/base.jsonl")
            PROJ_DATA="$PWD/data" target/release/proj-rs-bench >> new.jsonl
          done
      - name: Table
        run: |
          python3 - <<'PY'
          import json
          def load(path):
              best, batch_path = {}, None
              for line in open(path):
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  data = json.loads(line)
                  batch_path = data["batch_path"]
                  for case in data["cases"]:
                      name, ns = case["name"], case["ns_per_point"]
                      best[name] = min(best.get(name, 1e99), ns)
              return best, batch_path
          base, base_path = load("base.jsonl")
          new, new_path = load("new.jsonl")
          print(f"main: batch_path={base_path}; branch: batch_path={new_path}; smallest of 7 runs, ns per point")
          print(f"{'case':36} {'main':>9} {'branch':>9} {'main/branch':>12}")
          shown = 0
          for name, ns in new.items():
              old = base.get(name)
              if old is None:
                  continue
              ratio = old / ns
              keep = shown < 13 or name.startswith("facade_convert_array") or abs(ratio - 1) > 0.08
              if keep:
                  print(f"{name:36} {old:9.2f} {ns:9.2f} {ratio:11.2f}x")
              shown += 1
          PY
