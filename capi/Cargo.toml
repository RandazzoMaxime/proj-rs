[package]
name = "proj-rs-capi"
version = "1.2.6"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false
description = "C API of proj-rs: the proj.h of PROJ 9.9.0 on the proj-rs engine (292 functions)."
readme = "README.md"
repository = "https://github.com/RandazzoMaxime/proj-rs"
build = "build.rs"

# The artifacts are `libproj_rs_capi.so` / `.dylib` / `.dll` and `.a`. `tests/dist.sh`
# installs them as `libproj.so.25`, `libproj.so` and `libproj.a` (`docs/API-v1.md`):
# a library named `proj` in the workspace would give `proj.pdb` twice on Windows (the
# `proj` binary of the root package) and `proj` twice in `target/doc` (georust).
[lib]
name = "proj_rs_capi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]
doc = false

[features]
# Grid download over HTTP(S), as PROJ built with libcurl. Off by default: no TLS library is linked.
network = ["proj-rs/network"]

[dependencies]
proj-rs = { path = "..", version = "1.2.6" }

[lints]
workspace = true
