[workspace]
members = [".", "georust", "capi"]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "proj-rs"
version = "1.2.6"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Rust port of PROJ 9.9: projections, pipelines, and an embedded proj.db."
readme = "README.md"
repository = "https://github.com/RandazzoMaxime/proj-rs"
# Under the 10 MiB limit of crates.io. The parity corpus (24 MB, written by PROJ 9.9.0) and the
# repository tooling stay in git: the test suite runs from a checkout, not from the packaged
# crate. `tests/gie/passing.txt` stays because `proj-rs-bench` includes it.
exclude = [
    "/CLAUDE.md",
    "/.github",
    "/.grok",
    "/bench",
    "/tools",
    "/tests/parity",
]

[[bin]]
name = "proj-rs-bench"
path = "src/bin/bench.rs"
doc = false

[[bin]]
name = "proj-rs"
path = "src/bin/proj-rs.rs"
doc = false
# The tools it runs have their unit tests in their own binaries.
test = false

[[bin]]
name = "cct"
path = "src/bin/cct.rs"
doc = false

[[bin]]
name = "cs2cs"
path = "src/bin/cs2cs.rs"
doc = false

[[bin]]
name = "projinfo"
path = "src/bin/projinfo.rs"
doc = false

[[bin]]
name = "proj"
path = "src/bin/proj.rs"
doc = false

[[bin]]
name = "invproj"
path = "src/bin/invproj.rs"
doc = false

[[bin]]
name = "geod"
path = "src/bin/geod.rs"
doc = false

[[bin]]
name = "invgeod"
path = "src/bin/invgeod.rs"
doc = false

[[bin]]
name = "projsync"
path = "src/bin/projsync.rs"
doc = false
required-features = ["network"]

[features]
# AVX-512 batch path (8 lanes of `f64`, `src/simd/v8.rs`) on x86-64, preferred over AVX2 when the
# CPU has it. Off by default: it needs the AVX-512 types of `std::arch`, stable since Rust 1.89,
# above the `rust-version` floor of this crate (1.83), so the `pulp/x86-v4` feature is only
# enabled here, and only on x86_64. Build with `--features avx512` on a Rust >= 1.89 toolchain.
avx512 = ["pulp/x86-v4"]
geo-types = ["dep:geo-types"]
# Grid download over HTTP(S), as PROJ built with `ENABLE_CURL`. Off by default: without it no
# TLS library is compiled or linked, and a context with the network on can only use the
# callbacks of `set_network_callbacks`. See `docs/PORTING-network-feature.md`.
network = ["dep:native-tls"]
# Shows the internal modules (ISO 19111 model, engine, CLI back ends) in the
# documentation under `proj_rs::unstable`. They are public either way, and
# outside semver either way.
unstable = []

[lints]
workspace = true

[dependencies]
geo-types = { version = "0.7.16", optional = true }
# `serialize` opens the embedded proj.db with `deserialize_bytes`.
rusqlite = { version = "0.37.0", features = ["bundled", "serialize", "backup"] }
# GeoTIFF grids. `deflate` only: the test grids are uncompressed, deflate, or deflate+predictor.
tiff = { version = "0.10.3", default-features = false, features = ["deflate"] }
# Inflates the pages of the embedded proj.db (`src/projdb_exe.rs`). Already in the tree through
# tiff's deflate; a direct dependency only names it.
miniz_oxide = { version = "0.9.1", default-features = false }
# HTTPS grid download (feature `network`). 0.2.14 is rust-version 1.80 and uses SChannel on Windows.
# A small HTTP/1.1 client sits on top so the tree does not pull ureq's ICU stack.
native-tls = { version = "0.2.14", optional = true }

# The AVX2 batch path (`src/simd/`): safe wrappers of the intrinsics behind a CPU-detected token,
# and the dispatch into code compiled with `avx2,fma`. MIT; builds with Rust 1.83. The `avx512`
# feature adds the `x86-v4` feature of pulp, for the 8-lane AVX-512 path (`src/simd/v8.rs`); it
# needs Rust 1.89, so it is off by default and the floor build never enables it.
[target.'cfg(target_arch = "x86_64")'.dependencies]
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }

# The NEON batch path (`src/simd/neon.rs`): the same safe wrappers, for the intrinsics of aarch64.
[target.'cfg(target_arch = "aarch64")'.dependencies]
pulp = { version = "0.22.3", default-features = false, features = ["std"] }

# `access(2)` for the writability of `$HOME` (`datadir.rs`), the call of PROJ, through a safe API.
# Already in the tree (`tempfile`); rust-version 1.63, MIT / Apache-2.0.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

# Compiles the libproj timer of the bench (build.rs). Already in the tree (libsqlite3-sys), MIT /
# Apache-2.0, rust-version 1.65.
[build-dependencies]
cc = "1.2"

[dev-dependencies]
# YAML CLI cases. 0.9.34 is already in the offline registry.
serde_yaml = "=0.9.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The command-line tools (tools/dist-cli.sh): fat LTO and stripped symbols. Unwinding stays:
# `geotiff::contained` catches a panic of the `tiff` crate (docs/PORTING-multicall.md). The
# library and `proj-rs-capi` stay on the `release` profile.
[profile.release-cli]
inherits = "release"
lto = "fat"
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Group `allow(clippy::pedantic)` in source does not override a warn here on
# this toolchain, and the transcribed PROJ coefficients are intentionally long.
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
