[package]
name = "proj-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false
description = "Rust port of PROJ 9.9: projections, pipelines, and an embedded proj.db."
readme = "README.md"
repository = "https://github.com/RandazzoMaxime/proj-rs"

[[bin]]
name = "proj-rs-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "cct"
path = "src/bin/cct.rs"

[[bin]]
name = "cs2cs"
path = "src/bin/cs2cs.rs"

[[bin]]
name = "projinfo"
path = "src/bin/projinfo.rs"

[[bin]]
name = "proj"
path = "src/bin/proj.rs"

[features]
geo-types = ["dep:geo-types"]

[build-dependencies]
cc = "1.1"

[dependencies]
geo-types = { version = "0.7.16", optional = true }
# 0.37 is edition 2021 and does not declare a rust-version above 1.83.
# `serialize` opens the embedded proj.db with `deserialize_bytes`.
rusqlite = { version = "0.37.0", features = ["bundled", "serialize"] }
# GeoTIFF grids. `deflate` only: the test grids are uncompressed, deflate, or deflate+predictor.
tiff = { version = "0.10.3", default-features = false, features = ["deflate"] }
# HTTPS grid download. 0.2.14 is rust-version 1.80 and uses SChannel on Windows.
# A small HTTP/1.1 client sits on top so the tree does not pull ureq's ICU stack.
native-tls = "0.2.14"

[dev-dependencies]
# YAML CLI cases. 0.9.34 is already in the offline registry.
serde_yaml = "=0.9.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
# Group `allow(clippy::pedantic)` in source does not override a warn here on
# this toolchain, and the transcribed PROJ coefficients are intentionally long.
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
