[graph]
all-features = true

[advisories]
version = 2
# The fix needs rusqlite 0.41 (libsqlite3-sys 0.39, SQLite 3.54), Rust 1.89, above the rust-version
# of the crate (1.83). Exposure: a database file with a sibling -wal written by an untrusted party.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "fix needs rusqlite 0.41, Rust 1.89 > MSRV 1.83; to decide" },
]

[licenses]
version = 2
# The three crates of this repository are AGPL-3.0-only (LICENSE), not a license to accept from
# dependencies.
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "proj-rs" },
    { allow = ["AGPL-3.0-only"], crate = "proj-rs-georust" },
    { allow = ["AGPL-3.0-only"], crate = "proj-rs-capi" },
]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
