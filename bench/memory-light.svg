<text x="214" y="195.5" font-size="12" text-anchor="end">Create + 1,000,000 points</text>
<text x="214" y="209.5" font-size="11.5" text-anchor="end" class="d">one at a time</text>
<rect x="224" y="185" width="179.9" height="11" rx="2" class="proj"/>
<text x="408.9" y="194.5" font-size="11" class="d v">14.7 MiB</text>
<rect x="224" y="199" width="148.6" height="11" rx="2" class="ours"/>
<text x="377.6" y="208.5" font-size="11" class="d v">12.2 MiB</text>
<text x="784" y="201.5" font-size="12" text-anchor="end" class="d v">1.2× less memory</text>
<text x="214" y="235.5" font-size="12" text-anchor="end">Create + 1,000,000 points</text>
<text x="214" y="249.5" font-size="11.5" text-anchor="end" class="d">one array</text>
<rect x="224" y="225" width="364.4" height="11" rx="2" class="proj"/>
<text x="593.4" y="234.5" font-size="11" class="d v">29.9 MiB</text>
<rect x="224" y="239" width="332.6" height="11" rx="2" class="ours"/>
<text x="561.6" y="248.5" font-size="11" class="d v">27.3 MiB</text>
<text x="784" y="241.5" font-size="12" text-anchor="end" class="d v">1.1× less memory</text>
<text x="214" y="275.5" font-size="12" text-anchor="end">4267 → 4326, several candidates</text>
<text x="214" y="289.5" font-size="11.5" text-anchor="end" class="d">1,000,000 points, one at a time</text>
<rect x="224" y="265" width="199.5" height="11" rx="2" class="proj"/>
<text x="428.5" y="274.5" font-size="11" class="d v">16.4 MiB</text>
