<text x="784" y="281.5" font-size="12" text-anchor="end" class="d v">1.3× less memory</text>
<text x="16" y="336" font-size="11.5" class="d">VmHWM of the process: the loader, the mapped libraries and the 15.3 MiB buffer of the array scenario count. Measured by</text>
<text x="16" y="353" font-size="11.5" class="d">bench/footprint.sh (Nov 17 17:59 UTC, commit ad8d680), one machine, Linux x86-64: other systems, compilers or libc builds</text>
<text x="16" y="370" font-size="11.5" class="d">give other numbers.</text>
