<svg xmlns="http://www.w3.org/2000/svg" width="800" height="383" viewBox="0 0 800 383" role="img" aria-label="Peak memory of the same conversions, proj-rs against PROJ 9.9.0">
<title>Peak memory of the same conversions, proj-rs against PROJ 9.9.0</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.d{fill:#59636e}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#d1d9e0}.proj{fill:#8c959f}.ours{fill:#0969da}</style>
<text x="16" y="26" font-size="17" class="b">Peak memory of the same conversions, proj-rs against PROJ 9.9.0</text>
<text x="16" y="45" font-size="13" class="d">Peak resident memory of a process that runs one scenario, the median of 5 runs, the same points on both sides.</text>
<text x="16" y="64" font-size="13" class="d">Shorter is smaller.</text>
<rect x="16" y="77" width="14" height="10" rx="2" class="proj"/>
<text x="36" y="86" font-size="12.5">PROJ 9.9.0 (libproj, C++)</text>
<rect x="235" y="77" width="14" height="10" rx="2" class="ours"/>
<text x="255" y="86" font-size="12.5">proj-rs (Rust)</text>
<line x1="224" y1="99" x2="224" y2="296" class="g"/>
<text x="224" y="312" font-size="11.5" text-anchor="middle" class="d v">0</text>
<line x1="346" y1="99" x2="346" y2="296" class="g"/>
<text x="346" y="312" font-size="11.5" text-anchor="middle" class="d v">10</text>
<line x1="468" y1="99" x2="468" y2="296" class="g"/>
<text x="468" y="312" font-size="11.5" text-anchor="middle" class="d v">20</text>
<line x1="590" y1="99" x2="590" y2="296" class="g"/>
<text x="590" y="312" font-size="11.5" text-anchor="middle" class="d v">30</text>
<text x="614" y="312" font-size="11.5" class="d">MiB</text>
<text x="214" y="115.5" font-size="12" text-anchor="end">Start, nothing created</text>
<rect x="224" y="105" width="69" height="11" rx="2" class="proj"/>
<text x="298" y="114.5" font-size="11" class="d v">5.7 MiB</text>
<rect x="224" y="119" width="36.6" height="11" rx="2" class="ours"/>
<text x="265.6" y="128.5" font-size="11" class="d v">3.0 MiB</text>
<text x="784" y="121.5" font-size="12" text-anchor="end" class="d v">1.9× less memory</text>
<text x="214" y="155.5" font-size="12" text-anchor="end">Create 4326 → 2154</text>
<rect x="224" y="145" width="180.3" height="11" rx="2" class="proj"/>
<text x="409.3" y="154.5" font-size="11" class="d v">14.8 MiB</text>
<rect x="224" y="159" width="147.6" height="11" rx="2" class="ours"/>
<text x="376.6" y="168.5" font-size="11" class="d v">12.1 MiB</text>
