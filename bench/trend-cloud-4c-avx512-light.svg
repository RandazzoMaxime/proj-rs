<svg xmlns="http://www.w3.org/2000/svg" width="800" height="473" viewBox="0 0 800 473" role="img" aria-label="Time per point, cloud-4c-avx512">
<title>Time per point, cloud-4c-avx512</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.d{fill:#59636e}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#d1d9e0}.l{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.m{stroke:#ffffff;stroke-width:1.5}.s0{stroke:#0969da}.f0{fill:#0969da}.s1{stroke:#cf4a14}.f1{fill:#cf4a14}.s2{stroke:#14805a}.f2{fill:#14805a}.s3{stroke:#9a6700}.f3{fill:#9a6700}.s4{stroke:#bf3989}.f4{fill:#bf3989}</style>
<text x="16" y="26" font-size="17" class="b">Time per point, cloud-4c-avx512</text>
<text x="16" y="45" font-size="13" class="d">Nanoseconds per point, from a million-point grid for the bare projections and the Helmert shift, and from a</text>
<text x="16" y="64" font-size="13" class="d">200,000-point slice for convert_array through the facade; the median of 3 trials of 11 passes. Lower is faster. A gap</text>
<text x="16" y="83" font-size="13" class="d">is a run from before that case existed.</text>
