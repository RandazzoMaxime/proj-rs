<svg xmlns="http://www.w3.org/2000/svg" width="800" height="327" viewBox="0 0 800 327" role="img" aria-label="Size on disk to convert EPSG:4326 to EPSG:2154">
<title>Size on disk to convert EPSG:4326 to EPSG:2154</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.d{fill:#59636e}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#d1d9e0}.proj{fill:#8c959f}.ours{fill:#0969da}.code{fill-opacity:1}.db{fill-opacity:.58}.libs{fill-opacity:.3}</style>
<text x="16" y="26" font-size="17" class="b">Size on disk to convert EPSG:4326 to EPSG:2154</text>
<text x="16" y="45" font-size="13" class="d">Everything a program needs on disk to make this conversion: the program, the library, proj.db and the shared</text>
<text x="16" y="64" font-size="13" class="d">libraries they load (all but libc and libgcc_s), stripped. Shorter is smaller.</text>
