<text x="214" y="169" font-size="11" text-anchor="end" class="d">C program + libproj, TIFF and curl on</text>
<rect x="224" y="147" width="48.9" height="20" class="proj code"/>
<rect x="274.4" y="147" width="105.7" height="20" class="proj db"/>
<rect x="381.6" y="147" width="244.9" height="20" class="proj libs"/>
<text x="634" y="161" font-size="12" class="v b">37.9 MiB</text>
<text x="214" y="198" font-size="12" text-anchor="end">proj-rs as libproj</text>
<text x="214" y="211" font-size="11" text-anchor="end" class="d">same C program + libproj of capi/</text>
<rect x="224" y="189" width="87.5" height="20" class="ours code"/>
<rect x="313" y="189" width="105.7" height="20" class="ours db"/>
<rect x="420.2" y="189" width="59.5" height="20" class="ours libs"/>
<text x="487.2" y="203" font-size="12" class="v b">24.1 MiB</text>
