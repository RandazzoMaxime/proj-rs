<text x="213" y="86" font-size="12.5">proj.db</text>
<rect x="286" y="77" width="14" height="10" rx="2" class="proj libs" fill-opacity="1"/>
<text x="306" y="86" font-size="12.5">other shared libraries</text>
<line x1="224" y1="99" x2="224" y2="257" class="g"/>
<text x="224" y="273" font-size="11.5" text-anchor="middle" class="d v">0</text>
<line x1="330.5" y1="99" x2="330.5" y2="257" class="g"/>
<text x="330.5" y="273" font-size="11.5" text-anchor="middle" class="d v">10</text>
<line x1="437" y1="99" x2="437" y2="257" class="g"/>
<text x="437" y="273" font-size="11.5" text-anchor="middle" class="d v">20</text>
<line x1="543.5" y1="99" x2="543.5" y2="257" class="g"/>
<text x="543.5" y="273" font-size="11.5" text-anchor="middle" class="d v">30</text>
<line x1="650" y1="99" x2="650" y2="257" class="g"/>
<text x="650" y="273" font-size="11.5" text-anchor="middle" class="d v">40</text>
<text x="674" y="273" font-size="11.5" class="d">MiB</text>
<text x="214" y="114" font-size="12" text-anchor="end">PROJ 9.9.0</text>
<text x="214" y="127" font-size="11" text-anchor="end" class="d">C program + libproj, TIFF and curl off</text>
<rect x="224" y="105" width="48.2" height="20" class="proj code"/>
<rect x="273.7" y="105" width="105.7" height="20" class="proj db"/>
<rect x="380.9" y="105" width="39.7" height="20" class="proj libs"/>
<text x="428.1" y="119" font-size="12" class="v b">18.6 MiB</text>
