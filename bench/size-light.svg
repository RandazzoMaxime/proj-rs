<rect x="299.1" y="231" width="105.7" height="20" class="ours db"/>
<rect x="406.2" y="231" width="59.5" height="20" class="ours libs"/>
<text x="473.2" y="245" font-size="12" class="v b">22.8 MiB</text>
<text x="16" y="297" font-size="11.5" class="d">Bytes on disk after strip. Measured by bench/footprint.sh (Nov 16 22:16 UTC, commit 253877d), one machine, Linux x86-64:</text>
