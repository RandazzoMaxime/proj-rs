<text x="590" y="312" font-size="11.5" text-anchor="middle" class="d v">100</text>
<text x="614" y="312" font-size="11.5" class="d">MiB</text>
<text x="214" y="115.5" font-size="12" text-anchor="end">Start, nothing created</text>
<rect x="224" y="105" width="20.6" height="11" rx="2" class="proj"/>
<text x="249.6" y="114.5" font-size="11" class="d v">5.6 MiB</text>
