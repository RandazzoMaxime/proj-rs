<text x="16" y="336" font-size="11.5" class="d">VmHWM of the process: the loader, the mapped libraries and the 15.3 MiB buffer of the array scenario count. Measured by</text>
<text x="16" y="353" font-size="11.5" class="d">bench/footprint.sh (Nov 16 22:16 UTC, commit 253877d), one machine, Linux x86-64: other systems, compilers or libc builds</text>
<text x="16" y="370" font-size="11.5" class="d">give other numbers.</text>
