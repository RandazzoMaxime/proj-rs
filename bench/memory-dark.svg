<text x="214" y="195.5" font-size="12" text-anchor="end">Create + 1,000,000 points</text>
<text x="214" y="209.5" font-size="11.5" text-anchor="end" class="d">one at a time</text>
<rect x="224" y="185" width="54" height="11" rx="2" class="proj"/>
<text x="283" y="194.5" font-size="11" class="d v">14.8 MiB</text>
