<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" role="img" aria-label="proj-rs against PROJ 9.9.0, cloud-4c-avx512">
<title>proj-rs against PROJ 9.9.0, cloud-4c-avx512</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#f0f6fc}.d{fill:#9198a1}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#262c36}.proj{fill:#6e7681}.ours{fill:#3987e5}</style>
<text x="16" y="26" font-size="17" class="b">proj-rs against PROJ 9.9.0, cloud-4c-avx512</text>
<text x="16" y="45" font-size="13" class="d">Nanoseconds per point for the same points through both libraries, the best of 5 runs. Shorter is faster. One</text>
