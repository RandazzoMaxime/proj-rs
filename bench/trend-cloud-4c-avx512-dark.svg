<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#f0f6fc}.d{fill:#9198a1}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#262c36}.l{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.m{stroke:#0d1117;stroke-width:1.5}.s0{stroke:#3987e5}.f0{fill:#3987e5}.s1{stroke:#d95926}.f1{fill:#d95926}.s2{stroke:#199e70}.f2{fill:#199e70}.s3{stroke:#c98500}.f3{fill:#c98500}.s4{stroke:#d55181}.f4{fill:#d55181}</style>
<text x="16" y="26" font-size="17" class="b">Time per point, cloud-4c-avx512</text>
<text x="16" y="45" font-size="13" class="d">Nanoseconds per point, from a million-point grid for the bare projections and the Helmert shift, and from a</text>
<text x="16" y="64" font-size="13" class="d">200,000-point slice for convert_array through the facade; the median of 3 trials of 11 passes. Lower is faster. A gap</text>
<text x="16" y="83" font-size="13" class="d">is a run from before that case existed.</text>
