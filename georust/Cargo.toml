[package]
name = "proj-rs-georust"
version = "1.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Drop-in replacement for the georust `proj` 0.31 crate, on the proj-rs engine."
readme = "README.md"
repository = "https://github.com/RandazzoMaxime/proj-rs"

# The library is named `proj`, so `use proj::Proj;` keeps working after
# `proj = { package = "proj-rs-georust", version = "1" }`.
[lib]
name = "proj"
path = "src/lib.rs"

[features]
default = ["geo-types"]
geo-types = ["proj-rs/geo-types"]
# `proj` 0.31 feature names. `network` turns on the HTTP(S) client of proj-rs (off by
# default, as in `proj`). The grid reader is always built in and no libproj is linked,
# so the others only keep the `features = [..]` list of an existing manifest valid.
network = ["proj-rs/network"]
tiff = []
bundled_proj = []
pkg_config = []

[dependencies]
proj-rs = { path = "..", version = "1.1.0" }

[dev-dependencies]
approx = "0.5"
geo-types = { version = "0.7.16", features = ["approx"] }

[lints]
workspace = true
